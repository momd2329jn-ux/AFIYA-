<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#28594B">
    <title>إنشاء حساب | عافية AFIYA</title>
    <link rel="stylesheet" href="style.css">

    <style>
        .register-page {
            min-height: 100vh;
            background: #F6F1E8;
            padding: 35px 15px 60px;
        }

        .register-top {
            max-width: 1000px;
            margin: 0 auto 30px;
        }

        .register-card {
            max-width: 650px;
            margin: auto;
            padding: 32px;
            background: #FFFEFA;
            border: 1px solid #E7E5DA;
            border-radius: 20px;
            box-shadow: 0 15px 45px rgba(38,63,53,.07);
        }

        .register-heading {
            text-align: center;
            margin-bottom: 25px;
        }

        .register-heading h1 {
            color: #28594B;
            font-size: 28px;
            margin-bottom: 8px;
        }

        .register-heading p {
            color: #68766B;
            font-size: 14px;
        }

        .account-types {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 13px;
            margin-bottom: 25px;
        }

        .account-type {
            border: 1px solid #D9DED6;
            background: #FFFEFA;
            color: #28594B;
            border-radius: 13px;
            padding: 20px 10px;
            font: inherit;
            cursor: pointer;
            transition: .2s;
        }

        .account-type strong {
            display: block;
            font-size: 16px;
            margin-bottom: 5px;
        }

        .account-type span {
            font-size: 12px;
            color: #68766B;
        }

        .account-type:hover,
        .account-type.active {
            border-color: #28594B;
            background: #E8EFE7;
            box-shadow: 0 0 0 2px rgba(40,89,75,.08);
        }

        .form-title {
            color: #28594B;
            border-bottom: 1px solid #E7E5DA;
            padding-bottom: 12px;
            margin: 25px 0 18px;
            font-size: 19px;
        }

        .register-form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        .form-group label {
            color: #263F35;
            font-size: 14px;
            font-weight: bold;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            min-height: 46px;
            padding: 11px 13px;
            border: 1px solid #D9DED6;
            border-radius: 9px;
            background: #FFFEFA;
            color: #263F35;
            font: inherit;
            font-size: 14px;
        }

        .form-group textarea {
            min-height: 90px;
            resize: vertical;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #28594B;
            box-shadow: 0 0 0 3px rgba(40,89,75,.09);
        }

        .form-note {
            background: #E8EFE7;
            color: #28594B;
            padding: 13px;
            border-radius: 9px;
            font-size: 13px;
            line-height: 1.8;
        }

        .register-submit {
            width: 100%;
            margin-top: 8px;
        }

        .register-message {
            display: none;
            padding: 12px;
            border-radius: 9px;
            font-size: 13px;
            line-height: 1.8;
        }

        .register-message.show {
            display: block;
        }

        .register-message.error {
            background: #F8E8E5;
            color: #8A3028;
        }

        .register-message.info {
            background: #E8EFE7;
            color: #28594B;
        }

        .register-footer {
            text-align: center;
            margin-top: 22px;
            color: #68766B;
            font-size: 13px;
        }

        .register-footer a,
        .register-back {
            color: #28594B;
            font-weight: bold;
        }

        .register-back {
            display: inline-block;
            margin-bottom: 22px;
            font-size: 14px;
        }

        @media (max-width: 550px) {
            .register-card {
                padding: 24px 17px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .account-types {
                gap: 9px;
            }
        }
    </style>
</head>

<body>
<main class="register-page">

    <div class="register-top">
        <a class="brand" href="index.html">
            <span class="brand-icon">✚</span>
            <span class="brand-name">
                <strong>عافية</strong>
                <span>AFIYA</span>
            </span>
        </a>
    </div>

    <section class="register-card">

        <a class="register-back" href="index.html">← العودة للرئيسية</a>

        <div class="register-heading">
            <h1>إنشاء حساب جديد</h1>
            <p>اختار نوع الحساب حتى نعرض لك استمارة التسجيل المناسبة.</p>
        </div>

        <div class="account-types">
            <button type="button" class="account-type" data-type="patient">
                <strong>مريض</strong>
                <span>طلب خدمات الرعاية المنزلية</span>
            </button>

            <button type="button" class="account-type" data-type="nurse">
                <strong>ممرض / ممرضة</strong>
                <span>تقديم خدمات التمريض</span>
            </button>

            <button type="button" class="account-type" data-type="doctor">
                <strong>طبيب</strong>
                <span>تقديم الخدمات الطبية</span>
            </button>

            <button type="button" class="account-type" data-type="lab">
                <strong>مختبر / محلل</strong>
                <span>الخدمات والفحوصات المختبرية</span>
            </button>
        </div>

        <div id="formArea" hidden>
            <h2 class="form-title" id="formTitle"></h2>

            <form class="register-form" id="registerForm">
                <div id="dynamicFields" class="form-grid"></div>

                <div class="form-note" id="formNote"></div>

                <div class="register-message" id="registerMessage" role="status"></div>

                <button type="submit" class="btn btn-primary register-submit">
                    إرسال طلب إنشاء الحساب
                </button>
            </form>
        </div>

        <div class="register-footer">
            عندك حساب مسبقاً؟
            <a href="login.html">تسجيل الدخول</a>
        </div>

    </section>
</main>

<script src="register.js"></script>
</body>
</html>
